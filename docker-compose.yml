version: "3.9"

x-restart: &default-restart
  restart: unless-stopped

networks:
  ieq_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_data:

services:
  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  postgres:
    <<: *default-restart
    image: postgres:16-alpine
    container_name: ieq_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ieq}
      POSTGRES_USER: ${POSTGRES_USER:-ieq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ieqpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ieq_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ieq} -d ${POSTGRES_DB:-ieq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  redis:
    <<: *default-restart
    image: redis:7-alpine
    container_name: ieq_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ieqredis} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - ieq_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ieqredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # MinIO (armazenamento de objetos local S3-compatível)
  # ──────────────────────────────────────────────
  minio:
    <<: *default-restart
    image: minio/minio:latest
    container_name: ieq_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ieqminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ieqminio123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - ieq_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  # Backend (Node.js / Express / TypeScript)
  # ──────────────────────────────────────────────
  backend:
    <<: *default-restart
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ieq_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieq}:${POSTGRES_PASSWORD:-ieqpassword}@postgres:5432/${POSTGRES_DB:-ieq}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-ieqredis}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ieqminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ieqminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ieq-files}
      NODE_ENV: production
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks:
      - ieq_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ──────────────────────────────────────────────
  # Frontend (React/Vite PWA, servido por Nginx)
  # ──────────────────────────────────────────────
  frontend:
    <<: *default-restart
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ieq_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ieq_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────
  # Backup (PostgreSQL diário + replicação nuvem)
  # ──────────────────────────────────────────────
  backup:
    <<: *default-restart
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    container_name: ieq_backup
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ieq}:${POSTGRES_PASSWORD:-ieqpassword}@postgres:5432/${POSTGRES_DB:-ieq}?schema=public
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      CLOUD_S3_ENDPOINT: ${CLOUD_S3_ENDPOINT:-}
      CLOUD_S3_BUCKET: ${CLOUD_S3_BUCKET:-}
      CLOUD_S3_ACCESS_KEY: ${CLOUD_S3_ACCESS_KEY:-}
      CLOUD_S3_SECRET_KEY: ${CLOUD_S3_SECRET_KEY:-}
    volumes:
      - backup_data:/backups
    networks:
      - ieq_net
    depends_on:
      postgres:
        condition: service_healthy
