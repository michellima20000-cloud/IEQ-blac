name: ieq

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ieq}
      POSTGRES_USER: ${POSTGRES_USER:-ieq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ieqpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ieq_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save 60 1 --loglevel warning"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ieqredis}
    volumes:
      - redis_data:/data
    networks: [ieq_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ieqminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ieqminio123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [ieq_net]

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DATABASE_URL: postgresql://ieq:[REDACTED]@postgres:5432/ieq?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-ieqredis}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ieqminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ieqminio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ieq-files}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-this-with-another-long-random-secret}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    networks: [ieq_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks: [ieq_net]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backup:
    profiles: ["backup"]
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.backup
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ieq:[REDACTED]@postgres:5432/ieq?schema=public}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-replace-with-a-32-character-key}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      CLOUD_S3_ENDPOINT: ${CLOUD_S3_ENDPOINT:-}
      CLOUD_S3_BUCKET: ${CLOUD_S3_BUCKET:-}
      CLOUD_S3_ACCESS_KEY: ${CLOUD_S3_ACCESS_KEY:-}
      CLOUD_S3_SECRET_KEY: ${CLOUD_S3_SECRET_KEY:-}
    volumes:
      - backup_data:/backups
    networks: [ieq_net]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_data:

networks:
  ieq_net:
    driver: bridge
