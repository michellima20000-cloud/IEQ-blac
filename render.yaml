services:
  # Backend principal - API REST com Express + Prisma + JWT
  - type: web
    name: ieq-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node_modules/.bin/tsx src/server.ts
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        value: postgresql://ieq_banco_user:Q7exGvg46eVFiMSCQSabrWGpgMMDjlfJ@dpg-dbn6eq3bc2fs738m3t4g-a/ieq_banco
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_URL
        value: rediss://default:gQAAAAAAAvVLAAIgcDJhMGYwYjVmZDkwZGI0OWY3YmFjZWQwNDNkMjdjNzI0NA@engaged-mudfish-193867.upstash.io:6379
      - key: UPSTASH_REDIS_REST_URL
        value: https://engaged-mudfish-193867.upstash.io
      - key: UPSTASH_REDIS_REST_TOKEN
        value: ggAAAAAAAvVLAAIgcDIz7U15_xe2B7oYELNjbm27caanV8276qgLAibyH0i1ZA
      - key: FRONTEND_URL
        value: https://ieq-front.vercel.app
      - key: BACKUP_ENCRYPTION_KEY
        value: IEQ2026BackupKey32CharsExactlyXXX

databases:
  - name: ieq-postgres
    plan: free
    databaseName: ieq_db
    user: ieq_user
