services:
  # Backend principal - API REST com Express + Prisma + JWT
  # ATENÇÃO: as credenciais (banco, Redis, segredos JWT) NÃO ficam neste
  # arquivo. Configure-as no painel do Render (Environment) do serviço.
  - type: web
    name: ieq-black
    runtime: node
    rootDir: backend
    buildCommand: npm install && (npx prisma generate || echo "Aviso: prisma generate falhou no build") && (npx prisma db push --accept-data-loss || echo "Aviso: prisma db push falhou no build")
    startCommand: node_modules/.bin/tsx src/server.ts
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      # Banco de dados: use a connection string EXTERNA do Postgres no Render
      # (a string interna só funciona de dentro da rede do Render).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Segredo das rotas de manutenção (/api/v1/setup-db e /admin/bootstrap)
      - key: SETUP_SECRET
        generateValue: true
      # Dono do sistema: SOMENTE este e-mail (perfil ADM) acessa /api/v1/admin
      - key: ADMIN_OWNER_EMAILS
        value: michel.lima20000@gmail.com
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://ieq-blac.vercel.app
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
